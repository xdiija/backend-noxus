services:
    # image project
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        depends_on:
            - redis
        networks:
            - laravel

    # nginx
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8989:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - laravel

    # db mysql
    db:
        image: mysql:5.7.22
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-userpass}
            MYSQL_USER: ${DB_USERNAME:-username}
        volumes:
            - ./.docker/mysql/dbdata:/var/lib/mysql
        ports:
            - "3388:3306"
        networks:
            - laravel

    # redis
    redis:
        image: redis:latest
        networks:
            - laravel
        ports:
            - "6379:6379"

    # minio — S3-compatible object storage (Community Edition, self-hosted)
    minio:
        image: minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-noxus}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-noxus_secret_123}
        volumes:
            - ./.docker/minio/data:/data
        ports:
            - "9000:9000"   # S3 API — app uses minio:9000, browser uses localhost:9000
            - "9001:9001"   # Web console
        networks:
            - laravel

    # one-shot: create the private bucket on first boot, then exit
    createbuckets:
        image: minio/mc:latest
        depends_on:
            - minio
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-noxus}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-noxus_secret_123}
            AWS_BUCKET: ${AWS_BUCKET:-noxus-animals}
        entrypoint: >
            /bin/sh -c "
            until (/usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do echo 'waiting for minio...' && sleep 2; done;
            /usr/bin/mc mb -p local/$${AWS_BUCKET};
            /usr/bin/mc anonymous set none local/$${AWS_BUCKET};
            echo 'bucket ready';
            exit 0;
            "
        networks:
            - laravel

networks:
    laravel:
        driver: bridge
